// data-filepath属性から正確なファイルパスを取得するヘルパー関数（パーセントエンコーディング対応）
function getCleanFilePath(element) {
  var dataFilepath = element.getAttribute('data-filepath');
  var hrefFilepath = element.getAttribute('href');
  var rawFilepath = dataFilepath || hrefFilepath;
  
  // パーセントエンコーディングをデコード
  if (rawFilepath) {
    try {
      rawFilepath = decodeURIComponent(rawFilepath);
    } catch (e) {
      // デコードに失敗した場合はそのまま使用
      console.warn('Failed to decode filepath:', rawFilepath, e);
    }
  }
  
  // パスの先頭の/を除去
  if (!rawFilepath) return "";

  // basic normalisation / sanitisation
  rawFilepath = rawFilepath.replace(/\0/g, "");           // NUL byte
  rawFilepath = rawFilepath.replace(/^\//, "");           // leading slash
  // prevent “…/../” traversal
  while (rawFilepath.startsWith("../")) rawFilepath = rawFilepath.substring(3);

  return rawFilepath;
}

function applySortChange() {
  const sortBy = document.getElementById('sortBy').value;
  let sortOrder = document.getElementById('sortOrder').value;
  const currentPath = window.location.pathname;
  
  // 現在のソート設定を取得

  const currentOrder = comistreamConfig.currentOrder || 'asc';
  
  // デフォルトの名前順・昇順から更新日時順に切り替える場合は降順に自動変更
  if (currentSort === 'name' && currentOrder === 'asc' && sortBy === 'lastmod') {
    sortOrder = 'desc';
    // selectボックスも更新
    document.getElementById('sortOrder').value = 'desc';
    debugLog('INFO: Switching from default name/asc to lastmod/desc');
  }
  
  // 更新日時・サイズから名前順に切り替える場合は昇順に自動変更
  if ((currentSort === 'lastmod' || currentSort === 'size') && sortBy === 'name') {

    // selectボックスも更新
    document.getElementById('sortOrder').value = 'asc';
    debugLog('INFO: Switching from ' + currentSort + '/' + currentOrder + ' to name/asc');
  }
  
  // 新しいURLを作成してページを遷移
  const newUrl = `${currentPath}?sort=${sortBy}&order=${sortOrder}`;
  window.location.href = newUrl;
}

// ソートパネルの表示/非表示切り替え
function toggleSortPanel() {
  const sortPanel = document.getElementById('sortPanel');
  const sortToggle = document.getElementById('sortToggle');
  
  if (sortPanel.classList.contains('show')) {
    // パネルを非表示
    sortPanel.classList.remove('show');
    sortToggle.classList.remove('active');
    document.removeEventListener('click', closeSortPanelOnClickOutside);
  } else {
    // パネルを表示
    sortPanel.classList.add('show');
    sortToggle.classList.add('active');
    
    // パネル外クリックで閉じる（少し遅らせて設定）
    setTimeout(() => {
      document.addEventListener('click', closeSortPanelOnClickOutside);
    }, 100);
  }
}

// パネル外クリックで閉じる
function closeSortPanelOnClickOutside(event) {
  const sortPanel = document.getElementById('sortPanel');
  const sortToggle = document.getElementById('sortToggle');
  
  // クリックがパネルやトグルボタンの外だった場合のみ閉じる
  if (!sortPanel.contains(event.target) && !sortToggle.contains(event.target)) {
    sortPanel.classList.remove('show');
    sortToggle.classList.remove('active');
    document.removeEventListener('click', closeSortPanelOnClickOutside);
  }
}

  }else{

function login(){
  var user = window.prompt(translations['login'] || "ユーザー名を入力してください", loginuser);
  if (user == null) {
    // キャンセルの場合は何もしない
  }else if( user == "" || user == "guest" ){
    // 空白、guestはログアウト
    document.cookie = "comistreamUser=; path=/; max-age=0;";
    // ログアウト処理のAjax呼び出し
    var xhr = new XMLHttpRequest();
    xhr.open("GET", cgiPath + "?mode=logout", true);
    xhr.send();
    location.reload();
  } else if (user.match(/[^A-Za-z0-9]+/) || user.length > 16) {
    // 半角英数字以外の文字が存在する場合
    alert(translations['input_alphanumeric'] || "16文字までの半角英数字を入力してください");
  } else {
    // サーバーサイドでユーザー名の検証とセッションの確認を行う
    var xhr = new XMLHttpRequest();
    xhr.open("POST", cgiPath, true);
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var response = JSON.parse(xhr.responseText);
        if (response.isAdmin) {
          if (response.hasSession) {
            // 管理者であり、セッションが存在する場合
            document.cookie = "comistreamUser="+user+"; path=/; max-age=31536000;";
            location.reload();
          } else {
            // 管理者であるが、セッションが存在しない場合
            window.location.href = cgiPath + "?mode=login&user=" + encodeURIComponent(user);
          }
        } else {
          // 管理者でない場合
          document.cookie = "comistreamUser="+user+"; path=/; max-age=31536000;";
          location.reload();
        }
      }
    };
    xhr.send("mode=checkAdminAndSession&user=" + encodeURIComponent(user));
  }
}

// ディレクトリのカスタムアイコンを設定する関数
function applyDirectoryCustomIcons(){
  const colname = document.getElementsByClassName("indexcolname");
  const imgPath = location.origin+"/theme/covers/";
  const stylesheet = document.getElementById("stylesheet");
  const isCoverView = stylesheet && stylesheet.href.match(/style_cover\.css/);
  
  for (let i = 2; i < colname.length; i++) {
    const elm = colname[i].firstChild;
    
    if (elm && elm.href && elm.href.match(/\/$/)) {
      // ディレクトリの場合のみ処理
      
      // リストビューの場合は、まず通常アイコンが表示されるようにする
      if (!isCoverView) {
        const iconCell = colname[i].parentElement.querySelector('.indexcolicon img');
        if (iconCell) {
          iconCell.style.display = '';
          iconCell.style.visibility = '';
          iconCell.style.opacity = '';
        }
      }
      
      // data-filepath属性から正確なパスを取得（パーセントエンコーディング対応）
      let fullHref = elm.getAttribute('data-filepath') || elm.getAttribute('href');
      
      // パーセントエンコーディングをデコード
      if (fullHref) {
        try {
          fullHref = decodeURIComponent(fullHref);
        } catch (e) {
          // デコードに失敗した場合はそのまま使用
          console.warn('Failed to decode directory path:', fullHref, e);
        }
      }
      
      let pathAfterPublicDir = "";
      let publicDirWithSlash = publicDir + "/";

      if (publicDir !== "" && fullHref.includes(publicDirWithSlash)) {
        pathAfterPublicDir = fullHref.substring(fullHref.indexOf(publicDirWithSlash) + publicDirWithSlash.length);
      } else {
        // publicDir が空か、含まれていない場合は、URLのパス部分から取得するルン
        try {
          // 絶対URLかチェック
          if (fullHref.startsWith('http://') || fullHref.startsWith('https://')) {
            let urlObj = new URL(fullHref);
            pathAfterPublicDir = urlObj.pathname;
          } else {
            // 相対URLの場合はそのまま使用
            pathAfterPublicDir = fullHref;
          }
          if (pathAfterPublicDir.startsWith("/")) {
            pathAfterPublicDir = pathAfterPublicDir.substring(1);
          }
        } catch (e) {
          // URLの解析に失敗した場合は、hrefからドメイン部分を除去する感じでいくルン
          pathAfterPublicDir = fullHref.replace(location.origin, "");
          if (pathAfterPublicDir.startsWith("/")) {
            pathAfterPublicDir = pathAfterPublicDir.substring(1);
          }
          // それでも publicDir が先頭にある可能性があるので再度チェック
          if (publicDir !== "" && pathAfterPublicDir.startsWith(publicDirWithSlash)) {
              pathAfterPublicDir = pathAfterPublicDir.substring(publicDirWithSlash.length);
          }
        }
      }

      // 最後のスラッシュはエンコード前に保証するルン！
      if (!pathAfterPublicDir.endsWith("/")) {
        pathAfterPublicDir += "/";
      }

      let parts = pathAfterPublicDir.split('/');
      // 最後の要素はファイル名index.webpになるので、それはエンコードしないようにするルン！
      // ディレクトリのパス部分だけエンコードするルン！ 二重エンコードとシングルクォートも考慮するルン！
      let encodedParts = parts.slice(0, -1).map(function(part) {
        let decodedPart;
        try {
          // まずデコードしてみるルン
          decodedPart = decodeURIComponent(part);
        } catch (e) {
          // デコードに失敗したら、元のままでいくルン
          // (例: '%'単独など、不正なエンコードシーケンスの場合)
          decodedPart = part;
        }
        // それからエンコードして、シングルクォートも '%27' に置換するルン！
        return encodeURIComponent(decodedPart).replace(/\'/g, '%27');
      });

      // 末尾が空の要素（元々末尾が/だった名残）で終わっていれば、それは維持する
      let relativeDirPath = encodedParts.join('/');
      if (pathAfterPublicDir.endsWith("/") && parts.length > 1) { // ルート直下でないディレクトリの場合
          relativeDirPath += "/";
      }

      let dirCustomIconUrl = imgPath + relativeDirPath + "index.webp";

      // クロージャ問題を解決するために即時実行関数 (IIFE) を使用
      (function(currentLinkElement, currentDirCustomIconUrlToLoad) {
        let tempImgForDir = new Image();

        tempImgForDir.onload = function() {
          // ディレクトリアイコンサイズは560x656であることが必須
          // なぜか404画像がstatus 200で返ってきてしまうのでディレクトリアイコンかの判定はサイズでやっている
          if (this.width === 560 && this.height === 656) {
            // カスタムアイコンが見つかった場合
            if (isCoverView) {
              // カバービューの場合は背景画像として設定
              currentLinkElement.style.backgroundImage = "url('" + currentDirCustomIconUrlToLoad + "')";
              currentLinkElement.style.backgroundSize = "cover";
              currentLinkElement.style.backgroundPosition = "center center";
              currentLinkElement.style.backgroundRepeat = "no-repeat";
            }
            // リストビューの場合はカスタムアイコンは適用しない（通常のフォルダアイコンを保持）
          } else {
            // カスタムアイコンが無効な場合、背景画像をクリア
            currentLinkElement.style.removeProperty('background-image');
            currentLinkElement.style.removeProperty('background-size');
            currentLinkElement.style.removeProperty('background-position');
            currentLinkElement.style.removeProperty('background-repeat');
          }
        };
        tempImgForDir.onerror = function() {
          // カスタムアイコンが見つからない場合、背景画像をクリア
          currentLinkElement.style.removeProperty('background-image');
          currentLinkElement.style.removeProperty('background-size');
          currentLinkElement.style.removeProperty('background-position');
          currentLinkElement.style.removeProperty('background-repeat');
        };
        tempImgForDir.src = currentDirCustomIconUrlToLoad;
      })(elm, dirCustomIconUrl);
    }
  }
}

// コンテンツ初期化関数（Progressive HTML Rendering対応）
function reinitializeContentFeatures() {
  const colname = document.getElementsByClassName("indexcolname");
  debugLog('DEBUG reinitializeContentFeatures called, found', colname.length, 'elements');
  
  // 各要素にid属性とイベントハンドラーを設定（検索機能のため）
  for (var i = 2; i < colname.length; i++) {
    // お気に入りフラグにonclickイベントを追加する
    if (colname[i].previousSibling && colname[i].previousSibling.onclick !== toggleFavorite) {
      colname[i].previousSibling.onclick = toggleFavorite;
    }
    
    var elm = colname[i].firstChild;
    if (elm) {
      if (elm.href && elm.href.match(/\/$/)) {
        // ディレクトリの場合
        colname[i].id = elm.textContent.replace(/\/$/, "");
      } else {
        // ファイルの場合
        colname[i].id = elm.textContent;
        // linkhookイベントを設定
        if (elm.onclick !== linkhook) {
          elm.onclick = linkhook;
        }
      }
    }
  }
  
  // ソート設定の表示を更新
  initializeSortControls();
  
  debugLog('DEBUG Content features reinitialized for', colname.length - 2, 'items');
}

// プレビュー画像表示
function addMouseOverEvent(){
    const cover = document.getElementsByClassName("indexcolname");
    debugLog('DEBUG addMouseOverEvent called, found', cover.length, 'elements');
    
    for (let i = 0; i < cover.length; i++) {
      // 既存のイベントリスナーがある場合は削除
      if (cover[i]._mouseoverHandler) {
        cover[i].removeEventListener("mouseover", cover[i]._mouseoverHandler);
      }
      
      // デバッグ：data-image属性をチェック
      const dataImage = cover[i].getAttribute('data-image');
      if (i >= 2 && i < 5) { // 最初の数個だけログ出力
        debugLog(`DEBUG addMouseOverEvent [${i}]: data-image="${dataImage}"`);
      }
      
      // 新しいイベントハンドラーを作成
      const mouseoverHandler = function (e) {
        // console.log(e.target);
        if( document.getElementById("stylesheet").href.match(/style\.css/)) {
            // console.log("not cover");
        }else{
          // カバービューの時のみ動作
          const imageSrc = e.currentTarget.dataset.image;
          // console.log('DEBUG hover preview - imageSrc:', imageSrc, 'target:', e.currentTarget);
          if((typeof imageSrc !== 'undefined' )&&(imageSrc.length > 0)){
            // 画像定義があれば（ディレクトリの場合は空）
            modalImage.src = imageSrc;
            // カーソル位置から何ピクセル下に表示するか計算
            // プレビュー画像サイズは1734からより大きいx812固定
            // プレビュー画像は1734よりwindow幅が小さければ縮小される。縮小率を求める ↑上の方に移動
            if (previewWindowHeight*2 > document.documentElement.clientHeight){
              // もしwindow縦幅がプレビュー画像の2倍より小さい場合は縮小
              modal.style.width = "50%";
              previewWindowHeight = Math.round( previewWindowHeight / 2);
            }
            // もしwindow下端なら上に表示
            if (
              e.clientY + previewWindowHeight + 200 >
              document.documentElement.clientHeight
            ) {
              if (e.clientY - 200 - previewWindowHeight < 0) {
                // 上に移動すると上が切れるときにはつける
                // まずないはず、window縦幅極小なときとか？
                modal.style.top = 0;
                // console.log("A:"+modal.style.top);
              } else {
                // 下がはみ出る場合は上に表示
                // modal.style.top = e.clientY - 200 - previewWindowHeight + "px";
                // ちらつくんで常に下に表示
                modal.style.top = e.clientY + 200 + "px";
                  // console.log("B:"+modal.style.top+" Y:"+e.clientY);
              }
            } else {
              // 下表示 下が切れる場合には調整
              if (
                e.clientY + 200 + previewWindowHeight >
                document.documentElement.clientHeight
              ) {
                // こここねえよ
                modal.style.top =
                  document.documentElement.clientHeight -
                  previewWindowHeight +
                  "px";
                  // console.log("C:"+modal.style.top);
              } else {
                modal.style.top = e.clientY + 200 + "px";
                // console.log("D:"+modal.style.top+" Y:"+e.clientY);
              }
            }
              // console.log("mouseover");
              modal.style.display = "block";
            }else{
              // console.log("no image");
            }
        }
      };
      
      // イベントハンドラーを要素に関連付けて保存
      cover[i]._mouseoverHandler = mouseoverHandler;
      // イベントリスナーを登録
      cover[i].addEventListener("mouseover", mouseoverHandler);
    }
}
function addMouseOutEvent(){
  const cover = document.getElementsByClassName("indexcolname");
  for (let i = 0; i < cover.length; i++) {
    // 既存のイベントリスナーがある場合は削除
    if (cover[i]._mouseoutHandler) {
      cover[i].removeEventListener("mouseout", cover[i]._mouseoutHandler);
    }
    
    // 新しいイベントハンドラーを作成
    const mouseoutHandler = function () {
      modal.style.display = "none";
      // console.log("mouseout");

    cover[i]._mouseoutHandler = mouseoutHandler;
    // イベントリスナーを登録
    cover[i].addEventListener("mouseout", mouseoutHandler);
  }
}

for (var i = 2; i < colname.length; i++ ) {
  // お気に入りフラグにonclickイベントを追加する
  colname[i].previousSibling.onclick = toggleFavorite;
  var elm = colname[i].firstChild;
  var iconLink = colname[i].previousSibling.firstChild;
  var iconElement = iconLink ? iconLink.firstChild : null;

  if( elm.href.match(/\/$/) ){
    // ディレクトリの場合[1]-[9]をつける
    colname[i].id = elm.textContent.replace( /\/$/, "" );
    if( i<=10 ){
      elm.textContent = "["+(i-1)+"] "+elm.textContent;
    }

    // === ディレクトリのカスタムアイコン処理 ===
    // カバービューの場合のみディレクトリのカスタムアイコンを設定するルン！
    let currentCSS = document.getElementById("stylesheet").href;
    let isCoverView = currentCSS.includes("style_cover.css");
    // 初期読み込み時にカバービューの場合のみ、個別にディレクトリアイコンを設定
    if (isCoverView) {
      // data-filepath属性から正確なパスを取得（パーセントエンコーディング対応）
      let fullHref = elm.getAttribute('data-filepath') || elm.getAttribute('href');
      
      // パーセントエンコーディングをデコード
      if (fullHref) {
        try {
          fullHref = decodeURIComponent(fullHref);
        } catch (e) {
          // デコードに失敗した場合はそのまま使用
          console.warn('Failed to decode directory path (initial load):', fullHref, e);
        }
      }
      
      let pathAfterPublicDir = "";
      let publicDirWithSlash = publicDir + "/";

      if (publicDir !== "" && fullHref.includes(publicDirWithSlash)) {
        pathAfterPublicDir = fullHref.substring(fullHref.indexOf(publicDirWithSlash) + publicDirWithSlash.length);
      } else {
        // publicDir が空か、含まれていない場合は、URLのパス部分から取得するルン
        try {
          // 絶対URLかチェック
          if (fullHref.startsWith('http://') || fullHref.startsWith('https://')) {
            let urlObj = new URL(fullHref);
            pathAfterPublicDir = urlObj.pathname;
          } else {
            // 相対URLの場合はそのまま使用
            pathAfterPublicDir = fullHref;
          }
          if (pathAfterPublicDir.startsWith("/")) {
            pathAfterPublicDir = pathAfterPublicDir.substring(1);
          }
        } catch (e) {
          // URLの解析に失敗した場合は、hrefからドメイン部分を除去する感じでいくルン
          pathAfterPublicDir = fullHref.replace(location.origin, "");
          if (pathAfterPublicDir.startsWith("/")) {
            pathAfterPublicDir = pathAfterPublicDir.substring(1);
          }
          // それでも publicDir が先頭にある可能性があるので再度チェック
          if (publicDir !== "" && pathAfterPublicDir.startsWith(publicDirWithSlash)) {
              pathAfterPublicDir = pathAfterPublicDir.substring(publicDirWithSlash.length);
          }
        }
      }

      // 最後のスラッシュはエンコード前に保証するルン！
      if (!pathAfterPublicDir.endsWith("/")) {
        pathAfterPublicDir += "/";
      }

      let parts = pathAfterPublicDir.split('/');
      // 最後の要素はファイル名index.webpになるので、それはエンコードしないようにするルン！
      // ディレクトリのパス部分だけエンコードするルン！ 二重エンコードとシングルクォートも考慮するルン！
      let encodedParts = parts.slice(0, -1).map(function(part) {
        let decodedPart;
        try {
          // まずデコードしてみるルン
          decodedPart = decodeURIComponent(part);
        } catch (e) {
          // デコードに失敗したら、元のままでいくルン
          // (例: '%'単独など、不正なエンコードシーケンスの場合)
          decodedPart = part;
        }
        // それからエンコードして、シングルクォートも '%27' に置換するルン！
        return encodeURIComponent(decodedPart).replace(/\'/g, '%27');
      });

      // 末尾が空の要素（元々末尾が/だった名残）で終わっていれば、それは維持する
      let relativeDirPath = encodedParts.join('/');
      if (pathAfterPublicDir.endsWith("/") && parts.length > 1) { // ルート直下でないディレクトリの場合
          relativeDirPath += "/";
      }

      let dirCustomIconUrl = imgPath + relativeDirPath + "index.webp";

      // クロージャ問題を解決するために即時実行関数 (IIFE) を使用
      (function(currentLinkElement, currentDirCustomIconUrlToLoad) {
        let tempImgForDir = new Image();

        tempImgForDir.onload = function() {
          // ディレクトリアイコンサイズは560x656であることが必須
          // なぜか404画像がstatus 200で返ってきてしまうのでディレクトリアイコンかの判定はサイズでやっている
          if (this.width === 560 && this.height === 656) {
            currentLinkElement.style.backgroundImage = "url('" + currentDirCustomIconUrlToLoad + "')";
            currentLinkElement.style.backgroundSize = "cover";
            currentLinkElement.style.backgroundPosition = "center center";
            currentLinkElement.style.backgroundRepeat = "no-repeat";
          } else {
            currentLinkElement.style.removeProperty('background-image');
            currentLinkElement.style.removeProperty('background-size');
            currentLinkElement.style.removeProperty('background-position');
            currentLinkElement.style.removeProperty('background-repeat');
          }
        };
        tempImgForDir.onerror = function() {
          currentLinkElement.style.removeProperty('background-image');
          currentLinkElement.style.removeProperty('background-size');
          currentLinkElement.style.removeProperty('background-position');
          currentLinkElement.style.removeProperty('background-repeat');
        };
        tempImgForDir.src = currentDirCustomIconUrlToLoad;
      })(elm, dirCustomIconUrl);
    }
    // === ディレクトリのカスタムアイコン処理ここまで ===

  }else{
    // ディレクトリ以外はonclickイベント、表紙イメージを設定
    colname[i].id = elm.textContent;
    elm.onclick = linkhook;
    var coverImg = img.cloneNode(false);
    
    // data-filepath属性から正確なファイルパスを取得（パーセントエンコーディング対応）
    const dataFilepath = elm.getAttribute('data-filepath');
    const hrefFilepath = elm.getAttribute('href');
    let rawFilepath = dataFilepath || hrefFilepath;
    
    // パーセントエンコーディングをデコード
    if (rawFilepath) {
      try {
        rawFilepath = decodeURIComponent(rawFilepath);
      } catch (e) {
        // デコードに失敗した場合はそのまま使用
        console.warn('Failed to decode filepath for cover image:', rawFilepath, e);
      }
    }
    
    // デバッグ用ログ（特殊文字を含むファイルの場合のみ）
    if (elm.textContent.match(/[#?&=%\\:@<>"'|* ]/) || (rawFilepath && rawFilepath.match(/[#?&=%\\:@<>"'|* ]/))) {
      debugLog('DEBUG cover image path:', {
        filename: elm.textContent,
        dataFilepath: dataFilepath,
        hrefFilepath: hrefFilepath,
        rawFilepath: rawFilepath
      });
    }
    
    const extension = rawFilepath.split(".").pop();
    const extensionLength = (extension.length* -1) -1;
    const imagePath = rawFilepath.startsWith('/') ? rawFilepath.substring(1) : rawFilepath;
    coverImg.src = imgPath + imagePath.slice(0, extensionLength)+".jpg";
    
    // data-image属性はdir_list.phpで既に設定されているが、Progressive HTML Renderingを使わない場合の互換性のため設定
    if (!colname[i].getAttribute('data-image')) {
      colname[i].setAttribute('data-image', previewPath + imagePath.slice(0, extensionLength)+".webp");
    }
    
    colname[i].appendChild(coverImg);
  }
}
