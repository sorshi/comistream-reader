; 非rootで動かし、固定されたUnix socketだけでApacheに接続するルン。
[global]
pid = /tmp/comistream-runtime/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
user = apache
group = apache
listen = /tmp/comistream-runtime/php-fpm.sock
listen.mode = 0600
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
; アプリが必要な値だけを引き継ぐルン。
clear_env = yes
env[COMISTREAM_MANAGED_INSTALL] = 1
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[XDG_CACHE_HOME] = /tmp/comistream-fontcache
env[TZ] = Asia/Tokyo
catch_workers_output = yes
security.limit_extensions = .php
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[session.save_path] = /home/user/comistream/data/session
php_admin_value[upload_tmp_dir] = /tmp
