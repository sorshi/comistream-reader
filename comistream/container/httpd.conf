# 設定はイメージに固定し、公開データの.htaccessは解釈しないルン。
ServerRoot "/etc/httpd"
Listen 8080
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
User apache
Group apache
ServerName comistream.local
ServerTokens Prod
ServerSignature Off
PidFile "/tmp/comistream-runtime/httpd.pid"
DefaultRuntimeDir "/tmp/comistream-runtime"
ErrorLog "/proc/self/fd/2"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "/proc/self/fd/1" common

<Directory />
    AllowOverride None
    AllowOverrideList None
    Options None
    Require all denied
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

DocumentRoot "/home/user/public"
AllowEncodedSlashes NoDecode
TypesConfig /etc/mime.types
AddDefaultCharset UTF-8
FileETag None
EnableSendfile on

# パスをクエリ文字列へ移さず、元のREQUEST_URIをアプリで扱うルン。
RewriteEngine On
RewriteRule ^/theme/manifest\.json$ /cgi-bin/manifest.php [PT,L]
RewriteRule ^/theme/bibi/ /cgi-bin/epub_resource.php [PT,L]

# PHP入口は固定ファイルだけに限定するルン。
AliasMatch "^/cgi-bin/(comistream|dir_list|dir_list_api|livestream|music_player|manifest|epub_resource)\.php$" "/home/user/comistream/code/$1.php"
<Directory "/home/user/comistream/code">
    <FilesMatch "^(comistream|dir_list|dir_list_api|livestream|music_player|manifest|epub_resource)\.php$">
        Require all granted
        SetHandler "proxy:unix:/tmp/comistream-runtime/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>

<Directory "/home/user/public">
    Require all granted
    DirectoryIndex /cgi-bin/dir_list.php
    FallbackResource /cgi-bin/dir_list.php
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

# 生成物へのAliasを先に定義し、固定テーマと書込先を分けるルン。
Alias "/theme/covers/" "/home/user/comistream/data/theme/covers/"
Alias "/theme/preview/" "/home/user/comistream/data/theme/preview/"
Alias "/theme/hls/" "/home/user/comistream/data/theme/hls/"
Alias "/theme/" "/home/user/comistream/theme/"
<Directory "/home/user/comistream/theme">
    Require all granted
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(\.|$)">
        Require all denied
    </FilesMatch>
    <FilesMatch "^export\.php$">
        Require all granted
        SetHandler "proxy:unix:/tmp/comistream-runtime/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>

<DirectoryMatch "^/home/user/comistream/data/theme/(covers|preview)(/|$)">
    Require all denied
    ErrorDocument 404 /theme/icons/now-printing.gif
    <FilesMatch "(?i)\.(jpg|jpeg|webp|avif|png|gif)$">
        Require all granted
        SetHandler none
    </FilesMatch>
</DirectoryMatch>
<Directory "/home/user/comistream/data/theme/hls">
    Require all denied
    <FilesMatch "\.(m3u8|ts)$">
        Require all granted
        SetHandler none
    </FilesMatch>
</Directory>

AddType font/ttf .ttf
AddType audio/flac .flac
AddType audio/mpeg .mp3
AddType audio/mp4 .m4a
AddType audio/aac .aac
AddType audio/x-aiff .aiff .aif
AddType audio/wav .wav .wave
AddType audio/ogg .ogg .oga
AddType audio/x-ms-wma .wma
AddType application/vnd.apple.mpegurl .m3u8
AddType video/mp2t .ts
<Directory "/home/user/comistream/theme/fonts/kana-repeat">
    <FilesMatch "^ComistreamKanaRepeat-v[0-9]+\.ttf$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always unset ETag "expr=%{REQUEST_STATUS} == 404"
Header always set Cache-Control "max-age=0, no-cache, no-store, must-revalidate" "expr=%{REQUEST_STATUS} == 404"
